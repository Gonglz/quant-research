[project]
name = "quant-research"
version = "0.1.0"
description = "Lightweight research lab for economics, finance, accounting, statistics, and quantitative experiments."
requires-python = ">=3.11"
dependencies = [
  "jupyter>=1.1",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
]

[tool.ruff]
line-length = 100
